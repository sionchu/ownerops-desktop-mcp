[project]
name = "ownerops-desktop-mcp"
version = "0.2.0"
description = "Self-hosted desktop MCP with scoped filesystem, OAuth, and restricted shell"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=2.2,<3",
  "uvicorn>=0.35.0",
  "starlette>=0.47.0",
  "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
