[project]
name = "ownerops-desktop-mcp"
version = "0.1.0"
description = "Small self-hosted desktop MCP with scoped filesystem and restricted shell"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.25.0,<4",
  "uvicorn>=0.35.0",
  "starlette>=0.47.0",
  "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
