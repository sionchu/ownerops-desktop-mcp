name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: npm ci --ignore-scripts
      - run: uv sync --dev
      - run: scripts\sync_config.cmd
      - run: npm run verify:desktop
      - run: uv run python scripts\smoke_gateway.py
